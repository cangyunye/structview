# 变长分隔符协议示例：T1 对账文件
# 字段分隔符 |；金额为隐含 2 位小数（无小数点）；日期 yyyyMMdd
name: T1 对账文件
match: ["T1.111.*.csv"]          # 文件名模式，自动识别用
encoding: gbk
format: delimited
delimiter: "|"
fields:
  - {name: 商户号,   type: str}
  - {name: 交易日期, type: date, fmt: "%Y%m%d"}
  - {name: 交易金额, type: dec,  scale: 2}
  - {name: 币种,     type: enum, map: {CNY: 人民币, USD: 美元}}
  - {name: 状态,     type: enum, map: {"00": 成功, "01": 待清算, "02": 失败}}
  - {name: 备注,     type: str}
